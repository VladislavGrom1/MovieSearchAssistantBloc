name: movie_search_assistant_bloc
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Для генерации
  # 1. Генерация app_router.gr.dart -> закомментировать flutter_bloc, flutter_test, hive_generator
  # Команда: dart run build_runner build --delete-conflicting-outputs --build-filter="lib/app/router/*.dart"
  # 2. Генерация *_model.g.dart -> закомментировать auto_route_generator
  # Команда: dart run build_runner build --delete-conflicting-outputs --build-filter="lib/data/models/*.dart"
  
  generated:
     path: ./generated/
  built_collection: ^5.1.1
  json_annotation: ^4.9.0
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.1.1
  bloc_test: ^10.0.0
  get_it: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.8.0+1
  cupertino_icons: ^1.0.8
  auto_route: ^11.0.0
  flutter_screenutil: ^5.9.3
  mocktail: ^1.0.4

dev_dependencies:
  build_runner: ^2.4.6
  json_serializable: any
  #auto_route_generator: any
  hive_generator: ^2.0.1
  #flutter_hive_generator_fixed: ^0.0.3

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/icons/
  uses-material-design: true
