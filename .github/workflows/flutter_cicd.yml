name: Flutter CI/CD

on:
 push:
   branches:
     - "main"
   paths-ignore:
     - ".vscode/**"

jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v5
     - uses: actions/setup-java@v4
       with:
         distribution: 'oracle'
         java-version: '21'

     - uses: subosito/flutter-action@v2
       with:
        channel: 'stable'
        flutter-version: '3.35.4'
     
     - name: Decode Keystore
       run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/release_key.jks

     - name: Create key.properties
       run: |
          echo "storeFile=release_key.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

     - run: flutter pub get

     - run: sh ./scripts/flutter_analyze.sh

     - run: flutter test

     - run: flutter build apk --release

     - uses: actions/upload-artifact@v4
       with:
         name: APK for test
         path: build/app/outputs/apk/release/*.apk
